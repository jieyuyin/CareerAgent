spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_PORT:15432}}/${POSTGRES_DB:career_agent}
    username: ${POSTGRES_USER:career_agent}
    password: ${POSTGRES_PASSWORD:career_agent_dev}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:career_agent_dev}
      timeout: 3s

logging:
  level:
    com.careeragent: debug

management:
  endpoint:
    health:
      show-details: always
